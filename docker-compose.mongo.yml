# Relay + MongoDB.  docker compose -f docker-compose.mongo.yml up -d --build
services:
  relay:
    build: .
    image: relay-llm-gateway:latest
    restart: unless-stopped
    ports:
      - "${RELAY_PORT:-8080}:8080"
    environment:
      DB_TYPE: mongodb
      DATABASE_URL: mongodb://relay:${MONGO_PASSWORD:?set MONGO_PASSWORD in .env}@mongo:27017/relay?authSource=admin
      RELAY_MASTER_KEY: ${RELAY_MASTER_KEY:?set RELAY_MASTER_KEY in .env (npm run gen:key)}
      RELAY_MASTER_KEY_PREVIOUS: ${RELAY_MASTER_KEY_PREVIOUS:-}
      RELAY_WORKERS: ${RELAY_WORKERS:-auto}
      TRUST_PROXY: ${TRUST_PROXY:-}
    depends_on:
      mongo:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: relay
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - relay-mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  relay-mongo:
